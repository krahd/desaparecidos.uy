name: Apply artwork architecture migration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_artwork_architecture.py
      - .github/workflows/apply-artwork-architecture.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[artwork-architecture]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply, verify, and commit
        shell: bash
        run: |
          set +e
          LOG=/tmp/artwork-architecture.log
          : > "$LOG"
          run_step() {
            printf '\n## %s\n' "$1" | tee -a "$LOG"
            shift
            "$@" >> "$LOG" 2>&1
            return $?
          }

          status=0
          run_step migration python scripts/apply_artwork_architecture.py || status=$?
          if [ "$status" -eq 0 ]; then
            run_step pip-upgrade python -m pip install --upgrade pip || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step python-install python -m pip install -e '.[dev]' || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step python-tests python -m pytest -q --tb=short || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            (cd frontend && npm ci && npm test && npm run build) >> "$LOG" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step launcher bash -n start.sh || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step api-import python -c 'from desaparecidos.api import create_app; assert create_app().title' || status=$?
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            mkdir -p doc
            cp "$LOG" doc/artwork-architecture-migration-diagnostics.txt
            git add doc/artwork-architecture-migration-diagnostics.txt
            git commit -m 'Record artwork architecture migration failure [artwork-architecture]'
            git push origin HEAD:main
            exit "$status"
          fi

          rm -f doc/artwork-architecture-migration-diagnostics.txt
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git add src tests doc/artwork-architecture-migration-diagnostics.txt
          git commit -m 'Implement artwork-first placement architecture [artwork-architecture]'
          git push origin HEAD:main
