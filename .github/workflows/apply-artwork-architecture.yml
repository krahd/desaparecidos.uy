name: Apply artwork architecture migration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_artwork_architecture.py
      - .github/workflows/apply-artwork-architecture.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[artwork-architecture]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply focused migration
        run: python scripts/apply_artwork_architecture.py
      - name: Install Python project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run Python tests
        run: python -m pytest -q --tb=short
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Validate launcher syntax and API import
        run: |
          bash -n start.sh
          python -c 'from desaparecidos.api import create_app; assert create_app().title'
      - name: Commit verified migration
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Implement artwork-first placement architecture [artwork-architecture]'
          git push origin HEAD:main
