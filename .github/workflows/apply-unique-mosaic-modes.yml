def test_generate_request_exposes_new_mosaic_defaults() -> None:
    schema = create_app().openapi()["components"]["schemas"]["GenerateRequest"]["properties"]
    assert schema["fragment_size"]["default"] == 36
    assert schema["reuse_limit"]["default"] == 1
    assert schema["composition_mode"]["default"] == "grid"
    assert schema["unique_tiles"]["default"] is True
    assert schema["matching_mode"]["default"] == "spatial"
''', encoding="utf-8")

          doc = Path("doc/artwork-runtime.md")
          text = doc.read_text(encoding="utf-8")
          marker = "## Unique spatial mosaic modes"
          if marker not in text:
              text += '''

## Unique spatial mosaic modes

The fragment-based works expose two final composition modes in the local interface:

- **Grid** preserves a regular square lattice.
- **Free-positioned** uses deterministic displacement, scale, rotation, and overlap while retaining each fragment's matched target region.

The interface now defaults to 36-pixel tiles, spatial region matching, and unique tiles. Spatial matching compares the internal colour, luminance, and edge layout of source and target regions rather than treating each tile as a single average-colour pixel. With **Use each image region only once** enabled, a source crop cannot be reused. If the reviewed corpus cannot supply enough distinct regions, generation stops and asks for more approved/crawled images, a larger tile size, or a smaller output.
'''
              doc.write_text(text, encoding="utf-8")
