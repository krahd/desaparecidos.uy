              '''def _target_canvas(target: Image.Image, output_width: int, fragment_size: int) -> Image.Image:
              ratio = target.height / target.width
              width = max(fragment_size, int(round(output_width / fragment_size)) * fragment_size)
              height = max(fragment_size, int(round((width * ratio) / fragment_size)) * fragment_size)
              return target.resize((width, height), Image.Resampling.LANCZOS)
          ''',
              '''def _target_canvas(target: Image.Image, output_width: int, fragment_size: int) -> Image.Image:
              ratio = target.height / target.width
              width = max(fragment_size, int(round(output_width / fragment_size)) * fragment_size)
              height = max(fragment_size, int(round((width * ratio) / fragment_size)) * fragment_size)
              return target.resize((width, height), Image.Resampling.LANCZOS)


          def _spatial_descriptor_for(image: Image.Image) -> np.ndarray:
              """Describe the internal arrangement of an image region, not only its mean colour.

              The legacy six-value descriptor is retained for benchmark reproducibility. Artwork
              generation can instead compare a 4x4 colour layout and an 8x8 luminance/edge
              layout, making a candidate region answer to the structure of the target region.
              """
              arr = np.asarray(
                  image.convert("RGB").resize((8, 8), Image.Resampling.BILINEAR),
                  dtype=np.float32,
              ) / 255.0
              rgb_blocks = arr.reshape(4, 2, 4, 2, 3).mean(axis=(1, 3))
              luminance = 0.2126 * arr[:, :, 0] + 0.7152 * arr[:, :, 1] + 0.0722 * arr[:, :, 2]
              gradient_x = np.pad(np.diff(luminance, axis=1), ((0, 0), (0, 1)))
              gradient_y = np.pad(np.diff(luminance, axis=0), ((0, 1), (0, 0)))
              return np.concatenate(
                  [
                      rgb_blocks.reshape(-1) * 1.5,
                      luminance.reshape(-1),
                      np.abs(gradient_x).reshape(-1) * 0.75,
                      np.abs(gradient_y).reshape(-1) * 0.75,
                  ]
              ).astype(np.float32)


          def _matching_descriptor(image: Image.Image, mode: MatchingMode) -> np.ndarray:
              if mode == "legacy":
                  return descriptor_for(image)
              if mode == "spatial":
                  return _spatial_descriptor_for(image)
              raise ValueError(f"unsupported matching mode: {mode}")
          ''',
