name: Trigger unique spatial mosaic modes

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/mosaic-mode-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and run the prepared patch
        shell: bash
        run: |
          awk '
            /python - <<.PY./ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/apply-unique-mosaic-modes.yml > /tmp/apply_mosaic_modes.py
          python /tmp/apply_mosaic_modes.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run Python tests
        run: python -m pytest -q --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit verified implementation to main
        shell: bash
        run: |
          rm .github/workflows/apply-unique-mosaic-modes.yml
          rm .github/workflows/trigger-unique-mosaic-modes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add unique spatial grid and free mosaic modes"
          git push origin HEAD:main
          git push origin --delete agent/mosaic-mode-trigger || true
