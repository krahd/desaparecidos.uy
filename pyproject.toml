[build-system]
requires = ["setuptools>=69,<82", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "desaparecidos-uy"
version = "0.2.0"
description = "Local computational memorial artwork runtime, review tools, and GUI for desaparecidos.uy."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tomas Laurenzo" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless==4.13.0.92",
  "Pillow>=12.3,<13",
  "requests>=2.31,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<10"
]

[project.scripts]
desaparecidos = "desaparecidos.cli:main"
desaparecidos-artwork = "desaparecidos.artwork_runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
